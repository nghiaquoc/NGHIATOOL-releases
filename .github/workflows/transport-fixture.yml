name: One-time inert transport fixture
on:
  push:
    paths:
      - '.github/workflows/transport-fixture.yml'
permissions:
  contents: write
jobs:
  fixture:
    if: github.repository == 'nghiaquoc/NGHIATOOL-releases'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Publish inert prerelease fixture only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.0.2 >/dev/null 2>&1; then
            echo 'Fixture already exists; refusing to overwrite'
            exit 1
          fi
          printf '%s\n' 'NGHIATOOL TRANSPORT FIXTURE 20261125' 'INERT TEXT ONLY - NOT A WINDOWS EXECUTABLE - DO NOT RUN' > NGHIA-Tool-Setup.exe
          gh release create v0.0.2 NGHIA-Tool-Setup.exe --target "$GITHUB_SHA" --prerelease --title 'Transport fixture v0.0.2 (NOT SOFTWARE)' --notes 'Inert text file with protocol-required asset name. Not an installer. Never execute. No production signature or stable feed. Used only for isolated HTTPS transport verification.'
