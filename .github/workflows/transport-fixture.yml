name: Retire completed inert transport fixture
on:
  push:
    paths:
      - '.github/workflows/transport-fixture.yml'
permissions:
  contents: write
jobs:
  cleanup:
    if: github.repository == 'nghiaquoc/NGHIATOOL-releases'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Remove only verified test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v0.0.2 --json isPrerelease,isDraft,name,tagName,assets > release.json
          jq -e '.isPrerelease == true and .isDraft == false and .name == "Transport fixture v0.0.2 (NOT SOFTWARE)" and .tagName == "v0.0.2" and (.assets | length == 1) and .assets[0].name == "NGHIA-Tool-Setup.exe"' release.json
          gh release download v0.0.2 --pattern NGHIA-Tool-Setup.exe
          echo '0311d5bf5a25ea067013b2f25cacf13f2da83023fa6e3e54ecf9e18e6edc1850  NGHIA-Tool-Setup.exe' | sha256sum -c -
          gh release delete v0.0.2 --yes
          echo 'Test prerelease removed; historical commit and tag retained. No stable release modified.'
